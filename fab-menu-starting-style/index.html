<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animated FAB menu with @starting-style | SPLearnCSS</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <p class="hint">Tap the + button. The menu animates in <em>and</em> out of <code>display: none</code>, with no JavaScript.</p>

    <div class="menu">
      <!-- The checkbox is the whole state: checked = open -->
      <input type="checkbox" id="open" class="toggle" aria-label="Open the create menu">

      <a class="item" href="#" style="--i: 0; --x: -112px; --y: -30px; --c: #ff6fa8">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
        <span>Photo</span>
      </a>
      <a class="item" href="#" style="--i: 1; --x: -50px; --y: -106px; --c: #5aa9ff">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10l5-3v10l-5-3z"/></svg>
        <span>Video</span>
      </a>
      <a class="item" href="#" style="--i: 2; --x: 50px; --y: -106px; --c: #ffb547">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span>Voice</span>
      </a>
      <a class="item" href="#" style="--i: 3; --x: 112px; --y: -30px; --c: #b78cff">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></svg>
        <span>File</span>
      </a>

      <label for="open" class="fab" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </label>
    </div>
  </main>
</body>
</html>
